name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Проверяем, что репозиторий успешно клонируется
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Базовая проверка целостности репозитория
      - name: Verify repository structure
        run: |
          echo "Содержимое репозитория:"
          ls -la
          test -f README.md && echo "README найден" || echo "README отсутствует"

      # 3. Раскомментируйте блок под ваш язык, если проект требует сборки:
      # --- Python ---
